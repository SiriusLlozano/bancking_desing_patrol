spring.application.name=banckingsirbull
server.port=8080
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:banckingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
cors.allowed-origins=http://localhost:5173
# Permite que los mensajes de error (ej. "Credenciales invalidas") lleguen al frontend
server.error.include-message=always
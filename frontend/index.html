<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco Sirbull | Iniciar sesión</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>

  <section class="contenedor">
    <div class="tarjeta">
      <div class="cabecera-logo">
        <span class="simbolo">BS</span>
        <div>
          <h1>Banco Sirbull</h1>
          <p class="subtitulo">Sistema de gestión de cuentas</p>
        </div>
      </div>

      <h2 class="titulo-form">Iniciar sesión</h2>

      <form id="form-login" class="formulario">
        <label for="username">Usuario</label>
        <input id="username" type="text" required placeholder="admin" autocomplete="username" />

        <label for="password">Contraseña</label>
        <input id="password" type="password" required placeholder="admin123" autocomplete="current-password" />

        <button class="btn btn-primario" type="submit">Entrar</button>

        <p class="ayuda">Usuarios de prueba: <b>admin / admin123</b> &nbsp;·&nbsp; <b>demo / demo123</b></p>
      </form>

      <p id="mensaje" class="mensaje" hidden></p>

      <p class="cambiar-pagina">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </div>
  </section>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
